schemaVersion: "2"
kind: sandbox
name: claude-vscode
displayName: VSCode with Claude Code
description: Allow VSCode and the VSCode Claude Code extension

sandbox:
  image: "docker.io/library/sbx-vscode-arm64:latest"
  aiFilename: CLAUDE.md
  entrypoint:
    run: ["code", "tunnel"]

caps:
  network:
    allow:
      # --- VS Code tunnel + editor + Marketplace (not in balanced) ---
      - "claude.ai:443" # Claude Code sign-in (balanced has claude.com only)
      - "go.microsoft.com:443" # tunnel / update redirects
      - "vscode.download.prss.microsoft.com:443" # editor download
      - "main.vscode-cdn.net:443" # editor CDN
      - "anthropic.gallery.vsassets.io:443" # claude-code extension gallery
      - "anthropic.gallerycdn.vsassets.io:443" # claude-code extension CDN
      # --- GitHub Copilot (extension runs remotely, so egress is from the sandbox) ---
      - "api.github.com:443" # Copilot token + user (may already be in balanced)
      - "*.githubcopilot.com:443" # Copilot Chat language model + completions
      - "*.individual.githubcopilot.com:443" # individual-plan model endpoint (use *.business/*.enterprise instead for those plans)
      - "copilot-proxy.githubusercontent.com:443" # completions proxy
      - "origin-tracker.githubusercontent.com:443" # completions
      - "default.exp-tas.com:443" # feature flags / experimentation
      - "copilot-telemetry.githubusercontent.com:443" # telemetry (optional)
