name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - "scripts/validate-spec.sh"
      - "sbxvscode"
      - "sbxvscode-build"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "scripts/validate-spec.sh"
      - "sbxvscode"
      - "sbxvscode-build"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # shellcheck is preinstalled on ubuntu-latest runners. The scripts have
      # bash shebangs but no .sh extension, so pass them explicitly.
      - name: Run ShellCheck
        run: shellcheck scripts/validate-spec.sh sbxvscode sbxvscode-build
